<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f172a">
<title>نظام التحاليل الطبية</title>
<style>
  /* ==========================================
     المتغيرات العامة
     ========================================== */
  :root {
    --أساسي: #0ea5e9;
    --أساسي-غامق: #0284c7;
    --أساسي-فاتح: #e0f2fe;
    --نجاح: #10b981;
    --خطر: #ef4444;
    --تحذير: #f59e0b;
    --داكن: #0f172a;
    --رمادي-غامق: #334155;
    --رمادي: #64748b;
    --رمادي-فاتح: #cbd5e1;
    --خلفية: #f8fafc;
    --أبيض: #ffffff;
    --ظل-صغير: 0 1px 3px rgba(15, 23, 42, 0.08);
    --ظل-متوسط: 0 4px 12px rgba(15, 23, 42, 0.08);
    --ظل-كبير: 0 12px 32px rgba(15, 23, 42, 0.12);
    --حد-دائري: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
    background: var(--خلفية);
    direction: rtl;
    color: var(--داكن);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* خلفية متدرجة أنيقة */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 340px;
    background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%);
    z-index: -1;
  }

  /* ==========================================
     الشاشات
     ========================================== */
  .شاشة {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    animation: دخول 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes دخول {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .مخفي { display: none !important; }

  /* ==========================================
     الشاشة الرئيسية
     ========================================== */
  .رأس_الرئيسية {
    text-align: center;
    padding: 40px 0 50px;
    color: white;
  }

  .شعار {
    font-size: 72px;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    animation: طفو 3s ease-in-out infinite;
  }

  @keyframes طفو {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .رأس_الرئيسية h1 {
    font-size: 32px;
    font-weight: 800;
    color: white;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .رأس_الرئيسية p {
    color: rgba(255,255,255,0.85);
    font-size: 16px;
    font-weight: 400;
  }

  /* البطاقات الرئيسية */
  .بطاقات_رئيسية {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: -30px;
  }

  .بطاقة_رئيسية {
    background: var(--أبيض);
    border: none;
    border-radius: var(--حد-دائري);
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--ظل-متوسط);
    text-align: right;
    width: 100%;
    font-family: inherit;
    color: var(--داكن);
    position: relative;
    overflow: hidden;
  }

  .بطاقة_رئيسية::after {
    content: '←';
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%) translateX(10px);
    font-size: 22px;
    color: var(--رمادي-فاتح);
    transition: all 0.25s;
    opacity: 0;
  }

  .بطاقة_رئيسية:active {
    transform: scale(0.98);
    box-shadow: var(--ظل-صغير);
  }

  .بطاقة_رئيسية:active::after {
    transform: translateY(-50%) translateX(0);
    opacity: 1;
  }

  .أيقونة_البطاقة {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .أيقونة_البطاقة.أساسي { background: linear-gradient(135deg, #e0f2fe, #bae6fd); }
  .أيقونة_البطاقة.بنفسجي { background: linear-gradient(135deg, #ede9fe, #ddd6fe); }
  .أيقونة_البطاقة.أخضر { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }

  .نص_البطاقة h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--داكن);
    margin-bottom: 4px;
  }

  .نص_البطاقة p {
    font-size: 14px;
    color: var(--رمادي);
  }

  /* ==========================================
     رأس الصفحات الداخلية
     ========================================== */
  .رأس_صفحة {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 0 30px;
    color: white;
  }

  .زر_رجوع {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    padding: 0;
  }

  .زر_رجوع:active {
    background: rgba(255,255,255,0.35);
    transform: scale(0.95);
  }

  .رأس_صفحة h2 {
    font-size: 24px;
    font-weight: 700;
    color: white;
    margin: 0;
  }

  /* ==========================================
     البطاقات البيضاء
     ========================================== */
  .بطاقة_محتوى {
    background: var(--أبيض);
    border-radius: var(--حد-دائري);
    padding: 28px 24px;
    box-shadow: var(--ظل-متوسط);
    margin-bottom: 16px;
  }

  /* ==========================================
     الحقول
     ========================================== */
  .حقل {
    margin-bottom: 20px;
  }

  .حقل label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--رمادي-غامق);
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 16px 18px;
    font-size: 17px;
    border: 2px solid var(--رمادي-فاتح);
    border-radius: 12px;
    background: var(--أبيض);
    font-family: inherit;
    color: var(--داكن);
    transition: all 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus {
    outline: none;
    border-color: var(--أساسي);
    box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
  }

  input::placeholder {
    color: var(--رمادي-فاتح);
  }

  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: left 16px center;
    background-size: 20px;
    padding-left: 48px;
  }

  /* ==========================================
     الأزرار
     ========================================== */
  .زر_رئيسي {
    width: 100%;
    padding: 18px 24px;
    font-size: 17px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, var(--أساسي) 0%, var(--أساسي-غامق) 100%);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .زر_رئيسي:active {
    transform: scale(0.98);
    box-shadow: 0 2px 6px rgba(14, 165, 233, 0.25);
  }

  .زر_ثانوي {
    background: var(--أبيض);
    color: var(--رمادي-غامق);
    border: 2px solid var(--رمادي-فاتح);
    box-shadow: none;
    font-size: 15px;
    padding: 14px 20px;
  }

  .زر_ثانوي:active {
    background: var(--خلفية);
  }

  .زر_خطر {
    background: var(--خطر);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }

  /* ==========================================
     خطوات التسجيل
     ========================================== */
  .مؤشر_الخطوات {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }

  .نقطة_الخطوة {
    width: 32px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }

  .نقطة_الخطوة.نشط {
    background: white;
    width: 48px;
  }

  /* ==========================================
     رقم المريض
     ========================================== */
  .بطاقة_رقم_المريض {
    background: linear-gradient(135deg, var(--أساسي-فاتح) 0%, #bae6fd 100%);
    border-radius: var(--حد-دائري);
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
    border: 2px dashed var(--أساسي);
  }

  .بطاقة_رقم_المريض .تسمية {
    font-size: 13px;
    font-weight: 600;
    color: var(--أساسي-غامق);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .بطاقة_رقم_المريض .رقم {
    font-size: 22px;
    font-weight: 800;
    color: var(--داكن);
    word-break: break-word;
  }

  /* ==========================================
     قائمة التحاليل
     ========================================== */
  .قائمة_التحاليل {
    display: grid;
    gap: 12px;
  }

  .عنصر_تحليل {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: var(--خلفية);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .عنصر_تحليل:has(input:checked) {
    background: var(--أساسي-فاتح);
    border-color: var(--أساسي);
  }

  .عنصر_تحليل input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .مربع_اختيار {
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--رمادي-فاتح);
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: white;
  }

  .عنصر_تحليل:has(input:checked) .مربع_اختيار {
    background: var(--أساسي);
    border-color: var(--أساسي);
  }

  .مربع_اختيار::after {
    content: '✓';
    color: white;
    font-size: 16px;
    font-weight: 900;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
  }

  .عنصر_تحليل:has(input:checked) .مربع_اختيار::after {
    opacity: 1;
    transform: scale(1);
  }

  .أيقونة_تحليل {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: white;
    flex-shrink: 0;
  }

  .اسم_التحليل {
    font-size: 16px;
    font-weight: 600;
    color: var(--داكن);
    flex: 1;
  }

  /* ==========================================
     حقول إدخال القيم
     ========================================== */
  .حقل_قيمة {
    background: var(--خلفية);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .عنوان_حقل_قيمة {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .عنوان_حقل_قيمة .أيقونة {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .عنوان_حقل_قيمة .اسم {
    font-size: 16px;
    font-weight: 700;
    color: var(--داكن);
  }

  .عنوان_حقل_قيمة .وحدة {
    font-size: 13px;
    color: var(--رمادي);
    font-weight: 500;
  }

  .حقلان {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* ==========================================
     بطاقة مريض في السجل
     ========================================== */
  .بطاقة_مريض {
    background: var(--أبيض);
    border-radius: var(--حد-دائري);
    padding: 20px;
    box-shadow: var(--ظل-صغير);
    margin-bottom: 14px;
    border: 1px solid #e2e8f0;
  }

  .رأس_بطاقة_مريض {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f1f5f9;
  }

  .رأس_بطاقة_مريض .اسم {
    font-size: 17px;
    font-weight: 800;
    color: var(--داكن);
    word-break: break-word;
  }

  .رأس_بطاقة_مريض .تاريخ {
    font-size: 13px;
    color: var(--رمادي);
    margin-top: 4px;
  }

  .شارة_عدد {
    background: var(--أساسي-فاتح);
    color: var(--أساسي-غامق);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* جدول التحاليل */
  .جدول_تحاليل {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
  }

  .جدول_تحاليل tr {
    border-bottom: 1px solid #f1f5f9;
  }

  .جدول_تحاليل tr:last-child {
    border-bottom: none;
  }

  .جدول_تحاليل td {
    padding: 12px 8px;
    font-size: 15px;
    text-align: right;
  }

  .جدول_تحاليل td:first-child {
    color: var(--رمادي-غامق);
    font-weight: 500;
  }

  .جدول_تحاليل td:last-child {
    font-weight: 700;
    color: var(--داكن);
    text-align: left;
  }

  .قيمة_نتيجة {
    color: var(--أساسي-غامق);
  }

  /* أزرار البطاقة */
  .أزرار_بطاقة {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .زر_صغير {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .زر_صغير.نسخ {
    background: var(--أساسي-فاتح);
    color: var(--أساسي-غامق);
  }

  .زر_صغير.نسخ:active {
    background: #bae6fd;
  }

  .زر_صغير.حذف {
    background: #fee2e2;
    color: var(--خطر);
    flex: 0 0 auto;
    padding: 12px 16px;
  }

  .زر_صغير.حذف:active {
    background: #fecaca;
  }

  /* ==========================================
     البحث
     ========================================== */
  .حاوية_بحث {
    position: relative;
    margin-bottom: 20px;
  }

  .حاوية_بحث input {
    padding-right: 48px;
  }

  .حاوية_بحث .أيقونة_بحث {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--رمادي-فاتح);
    pointer-events: none;
  }

  /* ==========================================
     الإحصائيات
     ========================================== */
  .شبكة_إحصاء {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .بطاقة_إحصاء {
    background: var(--أبيض);
    border-radius: var(--حد-دائري);
    padding: 24px 20px;
    text-align: center;
    box-shadow: var(--ظل-متوسط);
    position: relative;
    overflow: hidden;
  }

  .بطاقة_إحصاء::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 4px;
  }

  .بطاقة_إحصاء.أساسي::before { background: var(--أساسي); }
  .بطاقة_إحصاء.أخضر::before { background: var(--نجاح); }

  .بطاقة_إحصاء .رقم {
    font-size: 38px;
    font-weight: 800;
    color: var(--داكن);
    line-height: 1;
    margin-bottom: 8px;
  }

  .بطاقة_إحصاء .عنوان {
    font-size: 14px;
    color: var(--رمادي);
    font-weight: 600;
  }

  /* قائمة تفاصيل الإحصائيات */
  .بطاقة_محتوى h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--داكن);
    margin-bottom: 16px;
  }

  .صف_إحصاء {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f1f5f9;
  }

  .صف_إحصاء:last-child {
    border-bottom: none;
  }

  .صف_إحصاء .اسم {
    font-size: 15px;
    color: var(--رمادي-غامق);
    font-weight: 500;
  }

  .صف_إحصاء .عدد {
    font-size: 16px;
    font-weight: 800;
    color: var(--أساسي-غامق);
    background: var(--أساسي-فاتح);
    padding: 4px 14px;
    border-radius: 20px;
    min-width: 48px;
    text-align: center;
  }

  /* ==========================================
     رسائل فارغة
     ========================================== */
  .حالة_فارغة {
    text-align: center;
    padding: 60px 20px;
    color: var(--رمادي);
  }

  .حالة_فارغة .أيقونة {
    font-size: 60px;
    opacity: 0.4;
    margin-bottom: 16px;
  }

  .حالة_فارغة p {
    font-size: 16px;
    font-weight: 500;
  }

  /* ==========================================
     Toast
     ========================================== */
  .توست {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--داكن);
    color: white;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    z-index: 9999;
    box-shadow: var(--ظل-كبير);
    animation: ظهور_توست 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-width: 90%;
    text-align: center;
  }

  @keyframes ظهور_توست {
    from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ==========================================
     أزرار الإدارة
     ========================================== */
  .شبكة_إدارة {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  /* ==========================================
     تجاوب الشاشات الصغيرة
     ========================================== */
  @media (max-width: 480px) {
    .شاشة { padding: 20px 16px 50px; }
    .رأس_الرئيسية { padding: 30px 0 40px; }
    .شعار { font-size: 60px; }
    .رأس_الرئيسية h1 { font-size: 26px; }
    .بطاقة_محتوى { padding: 22px 18px; }
    .شبكة_إحصاء { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===== الشاشة الرئيسية ===== -->
<div id="الشاشة_الرئيسية" class="شاشة">
  <div class="رأس_الرئيسية">
    <div class="شعار">🏥</div>
    <h1>نظام التحاليل الطبية</h1>
    <p>إدارة وتجميع بيانات التحاليل</p>
  </div>

  <div class="بطاقة_محتوى" style="margin-top: 20px;">

    <div class="شبكة_إدارة">
      <button class="زر_رئيسي زر_ثانوي" id="زر_تصدير">⬇️ تصدير نسخة احتياطية</button>
      <button class="زر_رئيسي زر_ثانوي" id="زر_استيراد">⬆️ استيراد نسخة</button>
      <button class="زر_رئيسي زر_خطر" id="زر_حذف_الكل">🗑️ حذف كل البيانات</button>
    </div>
    <input type="file" id="ملف_استيراد" accept=".json" style="display:none">
  </div>

<script>
// ==========================================
// الإعدادات
// ==========================================
const مفتاح_التخزين = 'قاعدة_بيانات_التحاليل';

const أنواع_التحاليل = {
  1: { الاسم: 'فصيلة الدم', الوحدة: '', أيقونة: '🩸' },
  2: { الاسم: 'الهيموغلوبين', الوحدة: 'g/dL', أيقونة: '🧪' },
  3: { الاسم: 'السكر التراكمي', الوحدة: '%', أيقونة: '📊' },
  4: { الاسم: 'السكر العشوائي', الوحدة: 'mg/dL', أيقونة: '🍬' },
  5: { الاسم: 'ضغط الدم', الوحدة: 'mmHg', أيقونة: '💓' }
};

// ==========================================
// قاعدة البيانات
// ==========================================
function قراءة_البيانات() {
  try {
    const بيانات = localStorage.getItem(مفتاح_التخزين);
    if (!بيانات) return { المرضى: [], التحاليل: [], العداد: 0 };
    const م = JSON.parse(بيانات);
    return {
      المرضى: م.المرضى || [],
      التحاليل: م.التحاليل || [],
      العداد: م.العداد || 0
    };
  } catch (e) {
    return { المرضى: [], التحاليل: [], العداد: 0 };
  }
}

function حفظ_البيانات(بيانات) {
  localStorage.setItem(مفتاح_التخزين, JSON.stringify(بيانات));
}

let معرف_المريض_الحالي = null;

// ==========================================
// Toast
// ==========================================
function توست(رسالة) {
  const قديم = document.querySelector('.توست');
  if (قديم) قديم.remove();
  const جديد = document.createElement('div');
  جديد.className = 'توست';
  جديد.textContent = رسالة;
  document.body.appendChild(جديد);
  setTimeout(() => جديد.remove(), 2500);
}

// ==========================================
// التنقل
// ==========================================
function إخفاء_الكل() {
  document.querySelectorAll('.شاشة').forEach(ش => ش.classList.add('مخفي'));
}

function العودة_للرئيسية() {
  إخفاء_الكل();
  document.getElementById('الشاشة_الرئيسية').classList.remove('مخفي');
  إعادة_تعيين_التسجيل();
}

function إعادة_تعيين_التسجيل() {
  document.getElementById('الاسم').value = '';
  document.getElementById('خطوة_الاسم').classList.remove('مخفي');
  document.getElementById('خطوة_التحاليل').classList.add('مخفي');
  document.getElementById('خطوة_القيم').classList.add('مخفي');
  document.querySelectorAll('.قائمة_التحاليل input').forEach(c => c.checked = false);
  document.getElementById('حقول_القيم').innerHTML = '';
  معرف_المريض_الحالي = null;
  تحديث_مؤشر_الخطوات(1);
}

function تحديث_مؤشر_الخطوات(رقم) {
  document.getElementById('نقطة1').classList.toggle('نشط', رقم === 1);
  document.getElementById('نقطة2').classList.toggle('نشط', رقم === 2);
  document.getElementById('نقطة3').classList.toggle('نشط', رقم === 3);
}

// ==========================================
// الخطوة 1
// ==========================================
function إنشاء_رقم_المريض() {
  const الاسم = document.getElementById('الاسم').value.trim();

  if (الاسم.split(' ').filter(ك => ك).length < 3) {
    alert('الرجاء إدخال الاسم الثلاثي كاملاً (ثلاث كلمات على الأقل)');
    return;
  }

  const بيانات = قراءة_البيانات();
  بيانات.العداد++;
  const الرقم = String(بيانات.العداد).padStart(4, '0');
  const رقم_المريض = `${الاسم}#${الرقم}`;

  const مريض_جديد = {
    المعرف: بيانات.العداد,
    الاسم_الثلاثي: الاسم,
    رقم_المريض: رقم_المريض,
    تاريخ_التسجيل: new Date().toISOString()
  };

  بيانات.المرضى.push(مريض_جديد);
  حفظ_البيانات(بيانات);

  معرف_المريض_الحالي = مريض_جديد.المعرف;
  document.getElementById('عرض_رقم_المريض').textContent = رقم_المريض;
  document.getElementById('خطوة_الاسم').classList.add('مخفي');
  document.getElementById('خطوة_التحاليل').classList.remove('مخفي');
  تحديث_مؤشر_الخطوات(2);
}

// ==========================================
// الخطوة 2
// ==========================================
function عرض_حقول_القيم() {
  const المختارة = [...document.querySelectorAll('.قائمة_التحاليل input:checked')];

  if (المختارة.length === 0) {
    alert('اختر تحليل واحد على الأقل');
    return;
  }

  const حاوية = document.getElementById('حقول_القيم');
  حاوية.innerHTML = '';

  المختارة.forEach(خانة => {
    const المعرف = خانة.value;
    const معلومة = أنواع_التحاليل[المعرف];

    if (المعرف === '1') {
      حاوية.innerHTML += `
        <div class="حقل_قيمة">
          <div class="عنوان_حقل_قيمة">
            <div class="أيقونة">${معلومة.أيقونة}</div>
            <div class="اسم">${معلومة.الاسم}</div>
          </div>
          <select id="قيمة-${المعرف}">
            <option value="">-- اختر الفصيلة --</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
          </select>
        </div>`;
    } else if (المعرف === '5') {
      حاوية.innerHTML += `
        <div class="حقل_قيمة">
          <div class="عنوان_حقل_قيمة">
            <div class="أيقونة">${معلومة.أيقونة}</div>
            <div class="اسم">${معلومة.الاسم}</div>
            <div class="وحدة">mmHg</div>
          </div>
          <div class="حقلان">
            <input type="number" id="انقباضي" placeholder="انقباضي" inputmode="numeric" />
            <input type="number" id="انبساطي" placeholder="انبساطي" inputmode="numeric" />
          </div>
        </div>`;
    } else {
      حاوية.innerHTML += `
        <div class="حقل_قيمة">
          <div class="عنوان_حقل_قيمة">
            <div class="أيقونة">${معلومة.أيقونة}</div>
            <div class="اسم">${معلومة.الاسم}</div>
            <div class="وحدة">${معلومة.الوحدة}</div>
          </div>
          <input type="number" step="0.1" id="قيمة-${المعرف}" placeholder="أدخل القيمة" inputmode="decimal" />
        </div>`;
    }
  });

  document.getElementById('خطوة_التحاليل').classList.add('مخفي');
  document.getElementById('خطوة_القيم').classList.remove('مخفي');
  تحديث_مؤشر_الخطوات(3);
}

// ==========================================
// الخطوة 3
// ==========================================
function حفظ_النتائج() {
  const المختارة = [...document.querySelectorAll('.قائمة_التحاليل input:checked')];
  const بيانات = قراءة_البيانات();
  const الآن = new Date().toISOString();

  for (const خانة of المختارة) {
    const المعرف = خانة.value;
    let القيمة = '';

    if (المعرف === '5') {
      const انقباضي = document.getElementById('انقباضي').value;
      const انبساطي = document.getElementById('انبساطي').value;
      if (!انقباضي || !انبساطي) {
        alert('أدخل قيمتي الضغط الانقباضي والانبساطي');
        return;
      }
      القيمة = `${انقباضي}/${انبساطي}`;
    } else {
      القيمة = document.getElementById(`قيمة-${المعرف}`).value;
      if (!القيمة) {
        alert('أدخل جميع القيم المطلوبة');
        return;
      }
    }

    بيانات.التحاليل.push({
      المعرف: بيانات.التحاليل.length + 1,
      معرف_المريض: معرف_المريض_الحالي,
      معرف_التحليل: parseInt(المعرف),
      القيمة: القيمة,
      تاريخ_التحليل: الآن
    });
  }

  حفظ_البيانات(بيانات);
  توست('✅ تم حفظ النتائج بنجاح');
  العودة_للرئيسية();
}

// ==========================================
// سجل المرضى
// ==========================================
function عرض_المرضى() {
  إخفاء_الكل();
  document.getElementById('شاشة_المرضى').classList.remove('مخفي');
  document.getElementById('بحث_المرضى').value = '';
  رسم_المرضى();
}

function رسم_المرضى(فلتر = '') {
  const بيانات = قراءة_البيانات();
  const حاوية = document.getElementById('قائمة_المرضى');

  let المرضى = [...بيانات.المرضى].reverse();

  if (فلتر) {
    المرضى = المرضى.filter(م =>
      م.رقم_المريض.includes(فلتر) || م.الاسم_الثلاثي.includes(فلتر)
    );
  }

  if (المرضى.length === 0) {
    حاوية.innerHTML = `
      <div class="حالة_فارغة">
        <div class="أيقونة">📭</div>
        <p>${فلتر ? 'لا توجد نتائج مطابقة' : 'لا يوجد مرضى مسجلون بعد'}</p>
      </div>`;
    return;
  }

  حاوية.innerHTML = المرضى.map(م => {
    const تحاليل_المريض = بيانات.التحاليل.filter(ت => ت.معرف_المريض === م.المعرف);
    const التاريخ = new Date(م.تاريخ_التسجيل).toLocaleDateString('ar-SA');

    return `
      <div class="بطاقة_مريض">
        <div class="رأس_بطاقة_مريض">
          <div>
            <div class="اسم">${م.رقم_المريض}</div>
            <div class="تاريخ">📅 ${التاريخ}</div>
          </div>
          ${تحاليل_المريض.length > 0 ? `
            <div class="شارة_عدد">${تحاليل_المريض.length} تحليل</div>
          ` : ''}
        </div>

        ${تحاليل_المريض.length > 0 ? `
          <table class="جدول_تحاليل">
            <tbody>
              ${تحاليل_المريض.map(ت => `
                <tr>
                  <td>${أنواع_التحاليل[ت.معرف_التحليل].أيقونة} ${أنواع_التحاليل[ت.معرف_التحليل].الاسم}</td>
                  <td class="قيمة_نتيجة">${ت.القيمة} ${أنواع_التحاليل[ت.معرف_التحليل].الوحدة || ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="أزرار_بطاقة">
            <button class="زر_صغير نسخ" data-نسخ="${م.المعرف}">📋 نسخ النتائج</button>
            <button class="زر_صغير حذف" data-حذف="${م.المعرف}">🗑️</button>
          </div>
        ` : '<p style="color:#94a3b8;text-align:center;padding:12px 0;font-size:14px;">لم تُسجَّل تحاليل لهذا المريض</p>'}
      </div>
    `;
  }).join('');

  حاوية.querySelectorAll('[data-نسخ]').forEach(زر => {
    زر.addEventListener('click', () => نسخ_نتائج(parseInt(زر.dataset.نسخ)));
  });
  حاوية.querySelectorAll('[data-حذف]').forEach(زر => {
    زر.addEventListener('click', () => حذف_مريض(parseInt(زر.dataset.حذف)));
  });
}

function نسخ_نتائج(معرف_مريض) {
  const بيانات = قراءة_البيانات();
  const مريض = بيانات.المرضى.find(م => م.المعرف === معرف_مريض);
  const تحاليل_المريض = بيانات.التحاليل.filter(ت => ت.معرف_المريض === معرف_مريض);

  let نص = `نتائج التحاليل الطبية\n`;
  نص += `━━━━━━━━━━━━━━━━━━━━━\n`;
  نص += `المريض: ${مريض.رقم_المريض}\n`;
  نص += `التاريخ: ${new Date().toLocaleDateString('ar-SA')}\n`;
  نص += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

  تحاليل_المريض.forEach(ت => {
    نص += `• ${أنواع_التحاليل[ت.معرف_التحليل].الاسم}: ${ت.القيمة} ${أنواع_التحاليل[ت.معرف_التحليل].الوحدة || ''}\n`;
  });

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(نص).then(() => {
      توست('📋 تم نسخ النتائج');
    }).catch(() => {
      عرض_نص_للنسخ(نص);
    });
  } else {
    عرض_نص_للنسخ(نص);
  }
}

function عرض_نص_للنسخ(نص) {
  const نافذة = document.createElement('div');
  نافذة.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
  نافذة.innerHTML = `
    <div style="background:white;border-radius:16px;padding:24px;max-width:500px;width:100%;">
      <h3 style="margin-bottom:12px;color:#0f172a;">انسخ النص يدوياً</h3>
      <textarea readonly style="width:100%;height:200px;padding:12px;border:2px solid #cbd5e1;border-radius:10px;font-family:inherit;font-size:14px;resize:none;">${نص}</textarea>
      <button style="margin-top:14px;width:100%;padding:14px;background:#0ea5e9;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;" id="زر_إغلاق_النسخ">إغلاق</button>
    </div>
  `;
  document.body.appendChild(نافذة);
  نافذة.querySelector('#زر_إغلاق_النسخ').addEventListener('click', () => نافذة.remove());
}

function حذف_مريض(معرف_مريض) {
  if (!confirm('هل أنت متأكد من حذف هذا المريض وكل تحاليله؟')) return;

  const بيانات = قراءة_البيانات();
  بيانات.المرضى = بيانات.المرضى.filter(م => م.المعرف !== معرف_مريض);
  بيانات.التحاليل = بيانات.التحاليل.filter(ت => ت.معرف_المريض !== معرف_مريض);
  حفظ_البيانات(بيانات);
  توست('🗑️ تم الحذف');
  رسم_المرضى(document.getElementById('بحث_المرضى').value.trim());
}

// ==========================================
// الإحصائيات
// ==========================================
function عرض_الإحصائيات() {
  إخفاء_الكل();
  document.getElementById('شاشة_الإحصائيات').classList.remove('مخفي');

  const بيانات = قراءة_البيانات();
  const حاوية = document.getElementById('محتوى_الإحصائيات');

  const إحصاء_حسب_النوع = {};
  Object.keys(أنواع_التحاليل).forEach(م => {
    إحصاء_حسب_النوع[م] = بيانات.التحاليل.filter(ت => ت.معرف_التحليل == م).length;
  });

  حاوية.innerHTML = `
    <div class="شبكة_إحصاء">
      <div class="بطاقة_إحصاء أساسي">
        <div class="رقم">${بيانات.المرضى.length}</div>
        <div class="عنوان">إجمالي المرضى</div>
      </div>
      <div class="بطاقة_إحصاء أخضر">
        <div class="رقم">${بيانات.التحاليل.length}</div>
        <div class="عنوان">إجمالي التحاليل</div>
      </div>
    </div>

    <div class="بطاقة_محتوى">
      <h3>📈 تفاصيل كل فحص</h3>
      ${Object.keys(أنواع_التحاليل).map(م => `
        <div class="صف_إحصاء">
          <span class="اسم">${أنواع_التحاليل[م].أيقونة} ${أنواع_التحاليل[م].الاسم}</span>
          <span class="عدد">${إحصاء_حسب_النوع[م]}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// ==========================================
// تصدير / استيراد / حذف
// ==========================================
function تصدير_البيانات() {
  const بيانات = قراءة_البيانات();
  const نص = JSON.stringify(بيانات, null, 2);
  const ملف = new Blob([نص], { type: 'application/json' });
  const رابط = URL.createObjectURL(ملف);
  const a = document.createElement('a');
  a.href = رابط;
  a.download = `نسخة_احتياطية_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(رابط);
  توست('⬇️ تم تصدير النسخة');
}

function استيراد_البيانات(حدث) {
  const ملف = حدث.target.files[0];
  if (!ملف) return;

  const قارئ = new FileReader();
  قارئ.onload = (e) => {
    try {
      const بيانات = JSON.parse(e.target.result);
      if (!بيانات.المرضى || !بيانات.التحاليل) {
        alert('ملف غير صالح');
        return;
      }
      if (!confirm('سيتم استبدال البيانات الحالية. متابعة؟')) return;
      حفظ_البيانات(بيانات);
      توست('✅ تم الاستيراد بنجاح');
      عرض_الإحصائيات();
    } catch (خطأ) {
      alert('خطأ في قراءة الملف');
    }
  };
  قارئ.readAsText(ملف);
  حدث.target.value = '';
}

function حذف_كل_البيانات() {
  if (!confirm('⚠️ سيتم حذف كل المرضى والتحاليل نهائياً. متأكد؟')) return;
  if (!confirm('تأكيد أخير: هل تريد الحذف؟')) return;
  localStorage.removeItem(مفتاح_التخزين);
  توست('🗑️ تم حذف كل البيانات');
  عرض_الإحصائيات();
}

// ==========================================
// ربط الأزرار
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('زر_مريض_جديد').addEventListener('click', function() {
    إخفاء_الكل();
    document.getElementById('شاشة_التسجيل').classList.remove('مخفي');
  });

  document.getElementById('زر_سجل_المرضى').addEventListener('click', عرض_المرضى);
  document.getElementById('زر_الإحصائيات').addEventListener('click', عرض_الإحصائيات);

  document.getElementById('زر_رجوع_1').addEventListener('click', العودة_للرئيسية);
  document.getElementById('زر_رجوع_2').addEventListener('click', العودة_للرئيسية);
  document.getElementById('زر_رجوع_3').addEventListener('click', العودة_للرئيسية);

  document.getElementById('زر_التالي_1').addEventListener('click', إنشاء_رقم_المريض);
  document.getElementById('زر_التالي_2').addEventListener('click', عرض_حقول_القيم);
  document.getElementById('زر_حفظ').addEventListener('click', حفظ_النتائج);

  document.getElementById('بحث_المرضى').addEventListener('input', function() {
    رسم_المرضى(this.value.trim());
  });

  document.getElementById('زر_تصدير').addEventListener('click', تصدير_البيانات);
  document.getElementById('زر_استيراد').addEventListener('click', function() {
    document.getElementById('ملف_استيراد').click();
  });
  document.getElementById('زر_حذف_الكل').addEventListener('click', حذف_كل_البيانات);
  document.getElementById('ملف_استيراد').addEventListener('change', استيراد_البيانات);

  document.getElementById('الاسم').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') إنشاء_رقم_المريض();
  });
});
</script>
